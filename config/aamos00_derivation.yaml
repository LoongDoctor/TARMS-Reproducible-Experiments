version: 1

source:
  participant_column: user_key
  relative_day_column: date
  daily_questionnaire:
    filename: anonym_aamos00_dailyquestionnaire.csv
    required: true
  modalities:
    peakflow:
      filename: anonym_aamos00_peakflow.csv
      required: false
      count_field: peakflow_readings
    inhaler:
      filename: anonym_aamos00_smartinhaler.csv
      required: false
      count_field: inhaler_events

priority:
  rule: sum_boolean_true
  reader_facing_label: derived three-item symptom count
  symptom_columns:
    - daily_night_symp
    - daily_day_symp
    - daily_limit_activity
  missing_policy: retain_ineligible

payload:
  daily_columns:
    - daily_night_symp
    - daily_day_symp
    - daily_limit_activity
    - daily_prev_inhaler
    - daily_relief_inhaler
    - daily_triggers
  include_modality_counts: true

flow:
  exclude_negative_modality_days: true

data_contract:
  observed:
    - configured daily questionnaire payload columns
  derived:
    - configured modality event counts and presence derived from source rows
    - eligible
    - clean_priority (derived three-item symptom count)
  synthetic:
    - all TARMS protocol metadata

official_release:
  doi: 10.7488/ds/3775
  participants: 22
  any_modality_participant_days: 2054
